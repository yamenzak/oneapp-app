<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100" role="img" aria-label="OneMarket">
  <style>
    :root { --brand-knockout: #0f172a; --brand-ground: #ffffff; }
    @media (prefers-color-scheme: dark) {
      :root { --brand-knockout: #ffffff; --brand-ground: #0b0f19; }
    }
  </style>
<defs>
  <linearGradient id="g-onemarket-top" x1="0%" y1="0%" x2="100%" y2="100%">
    <stop offset="0%" stop-color="#5eead4"/>
    <stop offset="100%" stop-color="#14b8a6"/>
  </linearGradient>
  <linearGradient id="g-onemarket-left" x1="0%" y1="0%" x2="100%" y2="100%">
    <stop offset="0%" stop-color="#0f766e"/>
    <stop offset="100%" stop-color="#115e59"/>
  </linearGradient>
  <linearGradient id="g-onemarket-right" x1="0%" y1="0%" x2="100%" y2="100%">
    <stop offset="0%" stop-color="#14b8a6"/>
    <stop offset="100%" stop-color="#0d9488"/>
  </linearGradient>
  <mask id="m-onemarketplace">
    <rect width="100%" height="100%" fill="#ffffff" />
    <line x1="45" y1="8" x2="45" y2="92" stroke="#000000" stroke-width="3.5" />
    <line x1="55" y1="8" x2="55" y2="92" stroke="#000000" stroke-width="3.5" />
  </mask>
</defs>
<!-- Isometric Platform Cube - Top Face (Teal Gradient) -->
<polygon points="50,16 82,34 50,52 18,34" fill="url(#g-onemarket-top)" mask="url(#m-onemarketplace)" />
<!-- Upper Surface Center Facet (Only area between cutouts is pure white) -->
<polygon points="43,19.9 50,16 57,19.9 57,48.1 50,52 43,48.1" fill="var(--brand-knockout, #ffffff)" mask="url(#m-onemarketplace)" />
<!-- Isometric Platform Cube - Left Face (Teal Gradient) -->
<polygon points="18,34 50,52 50,86 18,68" fill="url(#g-onemarket-left)" mask="url(#m-onemarketplace)" />
<!-- Isometric Platform Cube - Right Face (Teal Gradient) -->
<polygon points="50,52 82,34 82,68 50,86" fill="url(#g-onemarket-right)" mask="url(#m-onemarketplace)" />
</svg>
