<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100" role="img" aria-label="OneSheet">
  <style>
    :root { --brand-knockout: #0f172a; --brand-ground: #ffffff; }
    @media (prefers-color-scheme: dark) {
      :root { --brand-knockout: #ffffff; --brand-ground: #0b0f19; }
    }
  </style>
<defs>
  <linearGradient id="g-onesheet" x1="0%" y1="0%" x2="100%" y2="100%">
    <stop offset="0%" stop-color="#4ade80"/>
    <stop offset="100%" stop-color="#15803d"/>
  </linearGradient>
  <mask id="m-onesheet">
    <rect width="100%" height="100%" fill="#ffffff" />
    <line x1="46" y1="12" x2="46" y2="88" stroke="#000000" stroke-width="3.5" />
    <line x1="54" y1="12" x2="54" y2="88" stroke="#000000" stroke-width="3" />
    <line x1="12" y1="36" x2="88" y2="36" stroke="#000000" stroke-width="3" />
    <line x1="12" y1="52" x2="88" y2="52" stroke="#000000" stroke-width="3" />
    <line x1="12" y1="68" x2="88" y2="68" stroke="#000000" stroke-width="3" />
  </mask>
</defs>
<!-- Full White Spreadsheet Grid Body -->
<rect x="18" y="18" width="64" height="64" rx="8" fill="var(--brand-knockout, #ffffff)" mask="url(#m-onesheet)"/>
<!-- Emerald Header Row (Top Section y: 18 to 36) -->
<path d="M 18 26 C 18 21.5 21.5 18 26 18 L 74 18 C 78.5 18 82 21.5 82 26 L 82 36 L 18 36 Z" fill="url(#g-onesheet)" mask="url(#m-onesheet)"/>
</svg>
