<!-- Crimson Hardcover Binding -->
<path d="M 18 28 C 32 24 44 28 50 32 C 56 28 68 24 82 28 L 82 76 C 68 72 56 76 50 80 C 44 76 32 72 18 76 Z" fill="url(#g-onebook)" mask="url(#m-onebook)"/>
