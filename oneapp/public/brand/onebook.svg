    @media (prefers-color-scheme: dark) {
      :root { --brand-knockout: #ffffff; --brand-ground: #0b0f19; }
    }
  </style>
<defs>
  <linearGradient id="g-onebook" x1="0%" y1="0%" x2="100%" y2="100%">
    <stop offset="0%" stop-color="#fb7185"/>
