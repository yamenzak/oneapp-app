<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100" role="img" aria-label="OneSpace">
  <style>
    :root { --brand-knockout: #0f172a; --brand-ground: #ffffff; }
    @media (prefers-color-scheme: dark) {
      :root { --brand-knockout: #ffffff; --brand-ground: #0b0f19; }
    }
  </style>
<defs>
  <linearGradient id="g-onespace" x1="0%" y1="0%" x2="100%" y2="100%">
    <stop offset="0%" stop-color="#818cf8"/>
    <stop offset="100%" stop-color="#4338ca"/>
  </linearGradient>
  <mask id="m-onespace">
    <rect width="100%" height="100%" fill="#ffffff" />
    <line x1="46" y1="10" x2="46" y2="90" stroke="#000000" stroke-width="4" />
    <line x1="54" y1="10" x2="54" y2="90" stroke="#000000" stroke-width="3.5" />
  </mask>
</defs>
<!-- Gateway Orbit Ring -->
<circle cx="50" cy="50" r="34" fill="none" stroke="url(#g-onespace)" stroke-width="12" mask="url(#m-onespace)" />
<!-- Purposeful White Core Nexus -->
<circle cx="50" cy="50" r="12" fill="var(--brand-knockout, #ffffff)" mask="url(#m-onespace)" />
</svg>
