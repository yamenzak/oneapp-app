<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100" role="img" aria-label="OneSpace">
  <style>
    :root { --brand-knockout: #cbd5e1; --brand-ground: #ffffff; }
    @media (prefers-color-scheme: dark) {
      :root { --brand-knockout: #ffffff; --brand-ground: #0b0f19; }
    }
  </style>
<defs>
  <linearGradient id="g-onespace" x1="0%" y1="0%" x2="100%" y2="100%">
    <stop offset="0%" stop-color="#818cf8"/>
    <stop offset="100%" stop-color="#4338ca"/>
  </linearGradient>
  </defs>
<!-- Gateway Orbit Ring -->
<circle cx="50" cy="50" r="34" fill="none" stroke="url(#g-onespace)" stroke-width="12" />
<!-- Purposeful White Core Nexus -->
<circle cx="50" cy="50" r="12" fill="var(--brand-knockout, #ffffff)" />
</svg>
