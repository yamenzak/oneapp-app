<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100" role="img" aria-label="OneMail">
  <style>
    :root { --brand-knockout: #cbd5e1; --brand-ground: #ffffff; }
    @media (prefers-color-scheme: dark) {
      :root { --brand-knockout: #ffffff; --brand-ground: #0b0f19; }
    }
  </style>
<defs>
  <linearGradient id="g-onemail-back" x1="0%" y1="0%" x2="100%" y2="100%">
    <stop offset="0%" stop-color="#b91c1c"/>
    <stop offset="100%" stop-color="#7f1d1d"/>
  </linearGradient>
  <linearGradient id="g-onemail-pocket" x1="0%" y1="0%" x2="100%" y2="100%">
    <stop offset="0%" stop-color="#f87171"/>
    <stop offset="100%" stop-color="#dc2626"/>
  </linearGradient>
  <mask id="m-onemail">
    <rect width="100%" height="100%" fill="#ffffff" />
    <!-- Twin cuts form letter sheet vertical crease gutters -->
    <line x1="45" y1="8" x2="45" y2="92" stroke="#000000" stroke-width="3.5" />
    <line x1="55" y1="8" x2="55" y2="92" stroke="#000000" stroke-width="3.5" />
  </mask>
</defs>
<!-- Envelope Interior Shell (Dark Crimson Depth) -->
<rect x="18" y="32" width="64" height="48" rx="6" fill="url(#g-onemail-back)" mask="url(#m-onemail)" />
<!-- Purposeful White Letter Sheet (Rising out of envelope) -->
<path d="M 26 18 L 74 18 C 76.5 18 78 19.5 78 22 L 78 54 L 22 54 L 22 22 C 22 19.5 23.5 18 26 18 Z" fill="var(--brand-knockout, #ffffff)" mask="url(#m-onemail)" />
<!-- Letter Content Subtle Text Line Hints -->
<line x1="28" y1="26" x2="40" y2="26" stroke="#cbd5e1" stroke-width="2.5" stroke-linecap="round" mask="url(#m-onemail)" />
<line x1="60" y1="26" x2="72" y2="26" stroke="#cbd5e1" stroke-width="2.5" stroke-linecap="round" mask="url(#m-onemail)" />
<!-- Envelope Front Pocket (V-Fold Shield) -->
<path d="M 18 42 L 50 64 L 82 42 L 82 74 C 82 77.5 79.5 80 76 80 L 24 80 C 20.5 80 18 77.5 18 74 Z" fill="url(#g-onemail-pocket)" mask="url(#m-onemail)" />
</svg>
