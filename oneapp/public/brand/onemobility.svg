<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100" role="img" aria-label="OneMobility">
  <style>
    :root { --brand-knockout: #cbd5e1; --brand-ground: #ffffff; }
    @media (prefers-color-scheme: dark) {
      :root { --brand-knockout: #ffffff; --brand-ground: #0b0f19; }
    }
  </style>
<defs>
  <linearGradient id="g-onemobility" x1="0%" y1="0%" x2="100%" y2="100%">
    <stop offset="0%" stop-color="#38bdf8"/>
    <stop offset="100%" stop-color="#0369a1"/>
  </linearGradient>
  </defs>
<!-- Route Waypoint Diamond -->
<rect x="23" y="23" width="54" height="54" rx="10" transform="rotate(45 50 50)" fill="url(#g-onemobility)"/>
<!-- White Interchange Hub -->
<circle cx="50" cy="50" r="10" fill="var(--brand-knockout, #ffffff)"/>
</svg>
