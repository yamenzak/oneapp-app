<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100" role="img" aria-label="OneWallet">
  <style>
    :root { --brand-knockout: #e6ebf1; --brand-ground: #ffffff; }
    @media (prefers-color-scheme: dark) {
      :root { --brand-knockout: #ffffff; --brand-ground: #0b0f19; }
    }
  </style>
<defs>
  <linearGradient id="g-onewallet" x1="0%" y1="0%" x2="100%" y2="100%">
    <stop offset="0%" stop-color="#34d399"/>
    <stop offset="100%" stop-color="#059669"/>
  </linearGradient>
  </defs>
<!-- Green Card Body -->
<rect x="18" y="26" width="64" height="48" rx="8" fill="url(#g-onewallet)"/>
<!-- White Smart EMV Chip -->
<rect x="28" y="42" width="14" height="16" rx="3" fill="var(--brand-knockout, #ffffff)"/>
</svg>
