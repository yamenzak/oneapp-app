<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100" role="img" aria-label="OneWallet">
  <style>
    :root { --brand-knockout: #0f172a; --brand-ground: #ffffff; }
    @media (prefers-color-scheme: dark) {
      :root { --brand-knockout: #ffffff; --brand-ground: #0b0f19; }
    }
  </style>
<defs>
  <linearGradient id="g-onewallet" x1="0%" y1="0%" x2="100%" y2="100%">
    <stop offset="0%" stop-color="#34d399"/>
    <stop offset="100%" stop-color="#059669"/>
  </linearGradient>
  <mask id="m-onewallet">
    <rect width="100%" height="100%" fill="#ffffff" />
    <line x1="46" y1="15" x2="46" y2="85" stroke="#000000" stroke-width="3.5" />
    <line x1="54" y1="15" x2="54" y2="85" stroke="#000000" stroke-width="3" />
  </mask>
</defs>
<!-- Green Card Body -->
<rect x="18" y="26" width="64" height="48" rx="8" fill="url(#g-onewallet)" mask="url(#m-onewallet)"/>
<!-- White Smart EMV Chip -->
<rect x="28" y="42" width="14" height="16" rx="3" fill="var(--brand-knockout, #ffffff)" mask="url(#m-onewallet)"/>
</svg>
