<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100" role="img" aria-label="OneCRM">
  <style>
    :root { --brand-knockout: #cbd5e1; --brand-ground: #ffffff; }
    @media (prefers-color-scheme: dark) {
      :root { --brand-knockout: #ffffff; --brand-ground: #0b0f19; }
    }
  </style>
<defs>
  <linearGradient id="g-onecrm" x1="0%" y1="0%" x2="100%" y2="100%">
    <stop offset="0%" stop-color="#c084fc"/>
    <stop offset="100%" stop-color="#7e22ce"/>
  </linearGradient>
  <mask id="m-onecrm">
    <rect width="100%" height="100%" fill="#ffffff" />
    <line x1="46" y1="12" x2="46" y2="88" stroke="#000000" stroke-width="3.5" />
    <line x1="54" y1="12" x2="54" y2="88" stroke="#000000" stroke-width="3" />
  </mask>
</defs>
<!-- Purple Pipeline Funnel -->
<polygon points="18,22 82,22 58,56 58,82 42,74 42,56" fill="url(#g-onecrm)" mask="url(#m-onecrm)"/>
<!-- White Lead Stream Vector -->
<circle cx="50" cy="38" r="8" fill="var(--brand-knockout, #ffffff)" mask="url(#m-onecrm)"/>
</svg>
