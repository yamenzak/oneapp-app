<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100" role="img" aria-label="OneCalendar">
  <style>
    :root { --brand-knockout: #cbd5e1; --brand-ground: #ffffff; }
    @media (prefers-color-scheme: dark) {
      :root { --brand-knockout: #ffffff; --brand-ground: #0b0f19; }
    }
  </style>
<defs>
  <linearGradient id="g-onecal-header" x1="0%" y1="0%" x2="100%" y2="100%">
    <stop offset="0%" stop-color="#60a5fa"/>
    <stop offset="100%" stop-color="#2563eb"/>
  </linearGradient>
  <linearGradient id="g-onecal-grid" x1="0%" y1="0%" x2="100%" y2="100%">
    <stop offset="0%" stop-color="#1d4ed8"/>
    <stop offset="100%" stop-color="#1e3a8a"/>
  </linearGradient>
  <mask id="m-onecalendar">
    <rect width="100%" height="100%" fill="#ffffff" />
    <!-- Twin cuts align with binder loops and date columns -->
    <line x1="44" y1="8" x2="44" y2="92" stroke="#000000" stroke-width="3.5" />
    <line x1="56" y1="8" x2="56" y2="92" stroke="#000000" stroke-width="3.5" />
    <!-- Schedule time row dividers -->
    <line x1="14" y1="52" x2="86" y2="52" stroke="#000000" stroke-width="3" />
    <line x1="14" y1="68" x2="86" y2="68" stroke="#000000" stroke-width="3" />
  </mask>
</defs>
<!-- Calendar Pad Base (Grid Body) -->
<rect x="18" y="22" width="64" height="64" rx="8" fill="url(#g-onecal-grid)" mask="url(#m-onecalendar)" />
<!-- Purposeful White Date Sheet Card (Central focal day) -->
<rect x="22" y="38" width="56" height="44" rx="4" fill="var(--brand-knockout, #ffffff)" mask="url(#m-onecalendar)" />
<!-- Blue Calendar Month Header Bar -->
<path d="M 18 28 C 18 24.5 20.5 22 24 22 L 76 22 C 79.5 22 82 24.5 82 28 L 82 38 L 18 38 Z" fill="url(#g-onecal-header)" mask="url(#m-onecalendar)" />
<!-- Dual Binder Ring Clips (Anchor alignment for cuts) -->
<rect x="30" y="14" width="6" height="14" rx="3" fill="var(--brand-knockout, #ffffff)" />
<rect x="64" y="14" width="6" height="14" rx="3" fill="var(--brand-knockout, #ffffff)" />
</svg>
