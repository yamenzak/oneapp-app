<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100" role="img" aria-label="OneAI">
  <style>
    :root { --brand-knockout: #cbd5e1; --brand-ground: #ffffff; }
    @media (prefers-color-scheme: dark) {
      :root { --brand-knockout: #ffffff; --brand-ground: #0b0f19; }
    }
  </style>
<defs>
  <linearGradient id="g-oneai" x1="0%" y1="0%" x2="100%" y2="100%">
    <stop offset="0%" stop-color="#fda4af"/>
    <stop offset="100%" stop-color="#e11d48"/>
  </linearGradient>
  <mask id="m-oneai">
    <rect width="100%" height="100%" fill="#ffffff" />
    <line x1="46" y1="10" x2="46" y2="90" stroke="#000000" stroke-width="3.5" />
    <line x1="54" y1="10" x2="54" y2="90" stroke="#000000" stroke-width="3" />
  </mask>
</defs>
<!-- 4-Point Cognitive Star -->
<path d="M 50 14 C 50 36 36 50 14 50 C 36 50 50 64 50 86 C 50 64 64 50 86 50 C 64 50 50 36 50 14 Z" fill="url(#g-oneai)" mask="url(#m-oneai)"/>
<!-- White Synapse Spark -->
<circle cx="50" cy="50" r="8" fill="var(--brand-knockout, #ffffff)" mask="url(#m-oneai)"/>
</svg>
