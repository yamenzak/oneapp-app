<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100" role="img" aria-label="OneCode">
  <style>
    :root { --brand-knockout: #e6ebf1; --brand-ground: #ffffff; }
    @media (prefers-color-scheme: dark) {
      :root { --brand-knockout: #ffffff; --brand-ground: #0b0f19; }
    }
  </style>
<defs>
  <linearGradient id="g-onecode" x1="0%" y1="0%" x2="100%" y2="100%">
    <stop offset="0%" stop-color="#fbbf24"/>
    <stop offset="100%" stop-color="#d97706"/>
  </linearGradient>
  </defs>
<!-- Editor Tile -->
<rect x="14" y="14" width="72" height="72" rx="17" fill="url(#g-onecode)" />
<!-- White Prompt Chevron -->
<path d="M 33 37 L 46 50 L 33 63" fill="none" stroke="var(--brand-knockout, #ffffff)" stroke-width="7.5" stroke-linecap="round" stroke-linejoin="round" />
<!-- White Caret -->
<path d="M 55 63.5 L 68 63.5" fill="none" stroke="var(--brand-knockout, #ffffff)" stroke-width="7.5" stroke-linecap="round" />
</svg>
