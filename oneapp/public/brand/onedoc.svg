<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100" role="img" aria-label="OneDoc">
  <style>
    :root { --brand-knockout: #cbd5e1; --brand-ground: #ffffff; }
    @media (prefers-color-scheme: dark) {
      :root { --brand-knockout: #ffffff; --brand-ground: #0b0f19; }
    }
  </style>
<defs>
  <linearGradient id="g-onedoc" x1="0%" y1="0%" x2="100%" y2="100%">
    <stop offset="0%" stop-color="#60a5fa"/>
    <stop offset="100%" stop-color="#1d4ed8"/>
  </linearGradient>
  <mask id="m-onedoc">
    <rect width="100%" height="100%" fill="#ffffff" />
    <line x1="46" y1="15" x2="46" y2="85" stroke="#000000" stroke-width="3.5" />
    <line x1="54" y1="15" x2="54" y2="85" stroke="#000000" stroke-width="3" />
  </mask>
</defs>
<!-- Blue Document Page Body -->
<path d="M 22 18 L 56 18 L 78 40 L 78 82 L 22 82 Z" fill="url(#g-onedoc)" mask="url(#m-onedoc)"/>
<!-- White Folded Corner -->
<polygon points="56,18 56,40 78,40" fill="var(--brand-knockout, #ffffff)"/>
</svg>
