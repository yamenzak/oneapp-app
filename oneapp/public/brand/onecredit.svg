<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100" role="img" aria-label="OneCredit">
  <style>
    :root { --brand-knockout: #0f172a; --brand-ground: #ffffff; }
    @media (prefers-color-scheme: dark) {
      :root { --brand-knockout: #ffffff; --brand-ground: #0b0f19; }
    }
  </style>
<defs>
  <linearGradient id="g-onecredit" x1="0%" y1="0%" x2="100%" y2="100%">
    <stop offset="0%" stop-color="#fbbf24"/>
    <stop offset="100%" stop-color="#d97706"/>
  </linearGradient>
</defs>
<!-- Token Ring Coin -->
<circle cx="50" cy="50" r="34" fill="url(#g-onecredit)" />
<circle cx="50" cy="50" r="24" fill="var(--brand-ground, #0b0f19)" />
<!-- White Central Currency Pillar (Padded inside, not touching edges) -->
<rect x="46" y="31" width="8" height="38" rx="2" fill="var(--brand-knockout, #ffffff)" />
<!-- Currency Crossbars Strike (=) -->
<rect x="35" y="43" width="30" height="4" rx="2" fill="url(#g-onecredit)" />
<rect x="35" y="53" width="30" height="4" rx="2" fill="url(#g-onecredit)" />
</svg>
