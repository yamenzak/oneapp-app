[project]
name = "oneapp"
authors = [{ name = "Four Degree Labs", email = "hello@fourdegreelabs.com" }]
description = "Unified application surface for Four Degree Labs tenants."
requires-python = ">=3.10"
readme = "README.md"
dynamic = ["version"]
# Attachments live in R2 and so do this site's backups. Neither is optional-
# at-runtime in the way the config keys are: without boto3 every upload and
# every backup raises ImportError, and Frappe dropped its own boto3
# dependency, so nothing else pulls it in.
# And paramiko, for the SFTP door in `onemobility/sources.py`. SFTP is what a
# transport authority actually runs — more of them than HTTP — and there is no
# SFTP client in the standard library or in Frappe. Imported lazily so a site
# without it says so plainly instead of failing to boot.
dependencies = ["boto3~=1.35", "paramiko~=3.4"]

[build-system]
requires = ["flit_core >=3.4,<4"]
build-backend = "flit_core.buildapi"

[tool.bench.frappe-dependencies]
frappe = ">=15.0.0,<18.0.0"
erpnext = ">=15.0.0,<18.0.0"
# Payroll, leave balances and attendance. Declared as a *range* and not as a
# `required_apps` for the same reason erpnext is not — see hooks.py: nothing
# here imports it at module level, and a hard requirement would stop OneSpace
# running on every bench that does not carry it, development ones included.
hrms = ">=15.0.0,<18.0.0"
