[project]
name = "oneapp"
authors = [{ name = "Four Degree Labs", email = "hello@fourdegreelabs.com" }]
description = "Unified application surface for Four Degree Labs tenants."
requires-python = ">=3.10"
readme = "README.md"
dynamic = ["version"]
# Attachments live in R2 and so do this site's backups. Neither is optional-
# at-runtime in the way the config keys are: without boto3 every upload and
# every backup raises ImportError, and Frappe dropped its own boto3
# dependency, so nothing else pulls it in.
# And two for `onestorage/remote.py`, which mounts a folder on somebody else's
# server. paramiko for SFTP — what a transport authority actually runs, more of
# them than HTTP — and smbprotocol for SMB, which is what an office share is;
# it speaks SMB2 and SMB3, where `pysmb` is SMB1-era and every vendor has now
# switched SMB1 off. Neither is in the standard library or in Frappe. Both
# imported lazily, so a site without one says which protocol it cannot speak
# instead of failing to boot.
#
# FTP and WebDAV need nothing: `ftplib` is stdlib and WebDAV is HTTP, so it is
# `requests` and sixty lines of `ElementTree`.
dependencies = ["boto3~=1.35", "paramiko~=3.4", "smbprotocol~=1.15"]

[build-system]
requires = ["flit_core >=3.4,<4"]
build-backend = "flit_core.buildapi"

# Frappe only, and erpnext and hrms deliberately absent.
#
# This table is not documentation of what an app works with — bench and press
# both read it as a *requirement*: every app named here has to be installed on
# the bench, in range, before this one may be. So naming erpnext and hrms was
# `required_apps = ["erpnext"]` by another name, which hooks.py removed on
# purpose and for the reason written there: nothing in this app imports either
# at module level, every use is deferred and gated on `erpnext_installed()`.
#
# What it actually cost: the control bench carries frappe, oneapp_control and
# oneapp and must never carry ERPNext, so installing oneapp on it was refused
# outright — and on a tenant bench, adding oneapp before erpnext and hrms were
# in the group was refused too.
#
# Which apps a tenant site gets is decided elsewhere and better:
# `provisioning/steps.apps_for_site` installs `BASE_APPS = ("frappe", "oneapp")`
# plus whatever each granted space declares in `requires_apps`, against the list
# press says the bench group carries.
[tool.bench.frappe-dependencies]
frappe = ">=15.0.0,<18.0.0"
